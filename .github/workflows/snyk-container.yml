name: Snyk Container

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-container:
    runs-on: ubuntu-latest
    steps:
      - name: Snyk container test
        run: |
          docker run --rm \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -e SNYK_INTEGRATION_NAME=GITHUB_ACTIONS \
            -e SNYK_INTEGRATION_VERSION=docker \
            --platform linux/amd64 \
            snyk/snyk:docker \
            snyk container test ubuntu:latest
