apiVersion: apps/v1
kind: Deployment
metadata:
  name: snyk-juice-shop
  labels:
    app: snyk-juice-shop
spec:
  selector:
    matchLabels:
      app: snyk-juice-shop
  replicas: 1
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: snyk-juice-shop
    spec:
      containers:
      - name: juice-shop
        image: troysnyk/snyk-juice-shop:linux
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /rest/admin/application-version
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /juice-shop/frontend/dist/frontend/assets/public/images/uploads
        - name: logs
          mountPath: /juice-shop/logs
        securityContext:
          privileged: false
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
      volumes:
      - name: tmp
        emptyDir: {}
      - name: uploads
        emptyDir: {}
      - name: logs
        emptyDir: {}
